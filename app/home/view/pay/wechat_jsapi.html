{extend name="layout/base" /}

{block name="content"}
<div class="home-container" style="padding:60px 16px;">
  <div class="pay-result-wrap">
    <div class="pay-result-icon" style="color:#07c160;">
      <i class="fa-brands fa-weixin"></i>
    </div>
    <div class="pay-result-title">正在调起微信支付</div>
    <div class="pay-result-sub" id="pay-hint">请在弹出的收银台完成付款…</div>
    <div class="pay-result-order">订单号：{$order.order_no}</div>
    <div class="pay-result-actions">
      <button class="btn-primary" id="btn-retry" style="display:none;" onclick="invokePay()">
        <i class="fa-solid fa-rotate-right"></i> 重新支付
      </button>
      <a href="/user/orders" class="btn-default">查看我的订单</a>
    </div>
  </div>
</div>
{/block}

{block name="css"}
<link rel="stylesheet" href="/static/css/home/pay.css?v=20261015">
{/block}

{block name="js"}
<script>
window.PAY_PARAMS = {:json_encode($payParams, JSON_UNESCAPED_UNICODE|JSON_HEX_TAG|JSON_HEX_AMP)};
window.ORDER_NO   = {:json_encode($order['order_no'], JSON_UNESCAPED_UNICODE|JSON_HEX_TAG|JSON_HEX_AMP)};

function setHint(text, showRetry) {
  document.getElementById('pay-hint').textContent = text;
  document.getElementById('btn-retry').style.display = showRetry ? '' : 'none';
}

function invokePay() {
  setHint('请在弹出的收银台完成付款…', false);
  WeixinJSBridge.invoke('getBrandWCPayRequest', window.PAY_PARAMS, function (res) {
    if (res.err_msg === 'get_brand_wcpay_request:ok') {
      // 到账以异步回调为准，这里只负责把用户带到结果页
      location.href = '/pay/return?out_trade_no=' + encodeURIComponent(window.ORDER_NO);
    } else if (res.err_msg === 'get_brand_wcpay_request:cancel') {
      setHint('你取消了支付', true);
    } else {
      setHint('支付未完成，请重试', true);
    }
  });
}

// WeixinJSBridge 可能还没就绪
if (typeof WeixinJSBridge === 'undefined') {
  document.addEventListener('WeixinJSBridgeReady', invokePay, false);
} else {
  invokePay();
}
</script>
{/block}
