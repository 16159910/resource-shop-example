{extend name="layout/base" /}
{block name="content"}
<div class="home-container" style="padding:80px 16px;">
  <div style="text-align:center;max-width:420px;margin:0 auto;">
    <div style="font-size:64px;color:#d1d5db;margin-bottom:20px;">
      <i class="fa-solid fa-circle-xmark"></i>
    </div>
    <div style="font-size:22px;font-weight:700;color:var(--text);margin-bottom:10px;">订单已关闭</div>
    <div style="font-size:14px;color:var(--text-muted);line-height:1.7;margin-bottom:8px;">
      该订单超过 10 分钟未完成支付，已自动关闭。
    </div>
    {if !empty($order)}
    <div style="font-size:12px;color:#bbb;margin-bottom:32px;">订单号：{$order.order_no}</div>
    {/if}
    <div style="display:flex;justify-content:center;gap:12px;">
      <a href="/detail/{$order.material_id}" class="btn-primary">重新购买</a>
      <a href="/user/orders" class="btn-default">我的订单</a>
    </div>
  </div>
</div>
{/block}
