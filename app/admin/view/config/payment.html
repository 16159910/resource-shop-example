{extend name="layout/base" /}{block name="content"}
<div id="payment-app" class="share-settings" v-cloak>
  <div class="admin-share-intro">
    <div>
      <h2>支付设置</h2>
      <p>使用自己的应用、商户和通知配置。</p>
    </div>
  </div>
  <fieldset v-for="channel in channels">
    <legend>[[channel.name]]</legend>
    <label
      ><input type="checkbox" v-model="channel.enabled" /> 启用此支付方式</label
    >
    <div class="share-editor" style="margin-top: 24px">
      <label
        v-for="field in channel.fields"
        :class="field[2]=='textarea'?'wide':''"
        >[[ field[1] ]]<textarea
          v-if="field[2]=='textarea'"
          class="form-input"
          v-model="channel.values[field[0]]"
          autocomplete="off"
        ></textarea
        ><input
          v-else
          class="form-input"
          v-model="channel.values[field[0]]"
          :type="field[2]||'text'"
          autocomplete="off"
      /></label>
    </div>
    <button class="btn-primary" style="margin-top: 22px" @click="save(channel)">
      保存[[channel.name]]配置
    </button>
  </fieldset>
</div>
{/block}{block name="js"}
<script>
  const payRow=(row)=>{try{return typeof row?.config==='string'?JSON.parse(row.config||'{}'):(row?.config||{});}catch(e){return{};}};
  Vue.createApp({delimiters:['[[',']]'],data:()=>({channels:[{type:1,name:'支付宝',enabled:{:json_encode(($alipay['status']??0)==1)},values:payRow({:json_encode($alipay??null, JSON_UNESCAPED_UNICODE)}),fields:[['app_id','应用 App ID'],['private_key','应用私钥','textarea'],['alipay_public_key','支付宝公钥','textarea'],['gateway','网关地址']]},{type:2,name:'微信支付',enabled:{:json_encode(($wechat['status']??0)==1)},values:payRow({:json_encode($wechat??null, JSON_UNESCAPED_UNICODE)}),fields:[['appid','应用 AppID'],['mchid','商户号'],['key','API v3 密钥','password'],['serial_no','商户证书序列号'],['private_key_path','商户私钥文件路径'],['app_secret','公众号 AppSecret','password'],['notify_url','支付通知地址'],['h5_domain','H5 域名']]}]}),methods:{async save(channel){const r=await BizHelper.request('/admin/config/payment',{type:channel.type,status:channel.enabled?1:0,config:JSON.stringify(channel.values)});BizHelper.toast(r.code===0?'支付配置已保存':r.msg,r.code===0?'success':'error');}}}).mount('#payment-app');
</script>
{/block}
